name: Bug report
description: Something does not behave as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, use [private reporting](https://github.com/DevelopmentSprint/nuxt-openfga/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A minimal model, tuples and the call or request that misbehaves. A repository or StackBlitz link is ideal.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - server
        - memory
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: nuxt-openfga, Nuxt, Node.js, and the OpenFGA server or managed service in use.
    validations:
      required: true
