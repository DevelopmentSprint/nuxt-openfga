version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Git-flow: dependency updates land on develop and ship with the next release.
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    # Git-flow: dependency updates land on develop and ship with the next release.
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
