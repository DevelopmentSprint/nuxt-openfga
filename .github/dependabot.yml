version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Git-flow: dependency updates land on develop and ship with the next release.
    target-branch: develop
    schedule:
      interval: weekly
    # Wait before proposing a new release, so a malicious or broken version
    # has time to be caught and pulled first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    # Changesets CLI v3 and changesets/action v2 only work together; upgrade
    # both in one change.
    ignore:
      - dependency-name: "@changesets/cli"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
  # The documentation site (docs/) has its own lockfile.
  - package-ecosystem: npm
    directory: /docs
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - documentation
  - package-ecosystem: github-actions
    directory: /
    # Git-flow: dependency updates land on develop and ship with the next release.
    target-branch: develop
    schedule:
      interval: weekly
    # Wait before proposing a new release, so a malicious or broken version
    # has time to be caught and pulled first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    # changesets/action v2 requires Changesets CLI v3; see the npm entry.
    ignore:
      - dependency-name: changesets/action
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
